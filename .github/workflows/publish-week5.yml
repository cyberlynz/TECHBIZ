name: Publish rebuilt Week 5 portfolio

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-week5.yml"

permissions:
  contents: write

jobs:
  publish-week5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract rebuilt Week 5 package
        shell: bash
        run: |
          set -euo pipefail
          test -f week5-rebuilt.zip
          rm -rf .week5-staging "WK 5"
          unzip -q week5-rebuilt.zip -d .week5-staging
          test -s ".week5-staging/WK 5/README.md"
          test -s ".week5-staging/WK 5/Task 1/README.md"
          test -s ".week5-staging/WK 5/Task 2/README.md"
          test -s ".week5-staging/WK 5/Task 3/README.md"
          file_count="$(find ".week5-staging/WK 5" -type f | wc -l | tr -d ' ')"
          test "$file_count" = "26"
          mv ".week5-staging/WK 5" "WK 5"
          rm -rf .week5-staging
          rm -f week5-rebuilt.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "WK 5" week5-rebuilt.zip
          git commit -m "Publish rebuilt Week 5 portfolio"
          git push origin HEAD:main
