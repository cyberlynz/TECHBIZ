name: Rebuild Week 4 portfolio

on:
  push:
    branches:
      - main
    paths:
      - "WK 4/.week4-import-trigger"

permissions:
  contents: write

jobs:
  rebuild-week4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate the Week 4 package
        run: |
          set -euo pipefail
          cat "WK 4"/.week4-parts/part-*.b64 > /tmp/week4.zip.b64
          base64 --decode /tmp/week4.zip.b64 > /tmp/week4.zip
          unzip -tq /tmp/week4.zip
          mkdir -p /tmp/week4
          unzip -q /tmp/week4.zip -d /tmp/week4
          test -f "/tmp/week4/WK 4/README.md"
          test -f "/tmp/week4/WK 4/Task 1/README.md"
          test -f "/tmp/week4/WK 4/Task 2/README.md"
          test -f "/tmp/week4/WK 4/Task 3/README.md"
          test "$(find '/tmp/week4/WK 4/Task 1/screenshots' -type f | wc -l)" -eq 7
          test "$(find '/tmp/week4/WK 4/Task 2/screenshots' -type f | wc -l)" -eq 10
          test "$(find '/tmp/week4/WK 4/Task 3/screenshots' -type f | wc -l)" -eq 1

      - name: Publish Week 4 and remove temporary import data
        run: |
          set -euo pipefail
          cp -a /tmp/week4/. .
          rm -rf "WK 4/.week4-parts"
          rm -f "WK 4/.week4-import-trigger" ".github/workflows/week4-import.yml"
          git config user.name "Collins"
          git config user.email "87616634+cyberlynz@users.noreply.github.com"
          git add -A
          git commit -m "Publish Week 4 internship portfolio"
          git push origin main
