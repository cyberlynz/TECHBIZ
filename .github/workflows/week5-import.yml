name: Rebuild Week 5 portfolio

on:
  push:
    branches:
      - main
    paths:
      - "WK 5/.week5-rebuild-trigger"

permissions:
  contents: write

jobs:
  rebuild-week5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and validate the Week 5 package
        run: |
          set -euo pipefail
          cat "WK 5"/.week5-rebuild-parts/part-*.b64 > /tmp/week5-rebuild.zip.b64
          base64 --decode /tmp/week5-rebuild.zip.b64 > /tmp/week5-rebuild.zip
          unzip -tq /tmp/week5-rebuild.zip
          mkdir -p /tmp/week5-rebuild
          unzip -q /tmp/week5-rebuild.zip -d /tmp/week5-rebuild
          test -f "/tmp/week5-rebuild/WK 5/README.md"
          test -f "/tmp/week5-rebuild/WK 5/Task 1/README.md"
          test -f "/tmp/week5-rebuild/WK 5/Task 2/README.md"
          test -f "/tmp/week5-rebuild/WK 5/Task 3/README.md"
          test "$(find '/tmp/week5-rebuild/WK 5/Task 1/screenshots' -type f | wc -l)" -eq 7
          test "$(find '/tmp/week5-rebuild/WK 5/Task 2/screenshots' -type f | wc -l)" -eq 9
          test "$(find '/tmp/week5-rebuild/WK 5/Task 3/screenshots' -type f | wc -l)" -eq 5

      - name: Replace Week 5 files and remove temporary import data
        run: |
          set -euo pipefail
          cp -a /tmp/week5-rebuild/. .
          rm -rf "WK 5/.week5-parts" "WK 5/.week5-rebuild-parts"
          rm -f "WK 5/.week5-rebuild-trigger" ".github/workflows/week5-import.yml"
          git config user.name "Collins"
          git config user.email "87616634+cyberlynz@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Week 5 portfolio to match internship format"
          git push origin main
