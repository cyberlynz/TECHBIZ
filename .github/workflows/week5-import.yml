name: Import Week 5 assets

on:
  push:
    branches:
      - main
    paths:
      - "WK 5/.week5-import-trigger"

permissions:
  contents: write

jobs:
  import-week5:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Join package parts, decode and extract
        run: |
          cat "WK 5"/.week5-parts/*.b64 > /tmp/week5-package.zip.b64
          base64 --decode /tmp/week5-package.zip.b64 > /tmp/week5-package.zip
          mkdir -p /tmp/week5-package
          unzip -q /tmp/week5-package.zip -d /tmp/week5-package
          cp -a /tmp/week5-package/. .
          rm -rf "WK 5/.week5-parts"
          rm "WK 5/.week5-import-trigger"
          rm ".github/workflows/week5-import.yml"
          git config user.name "Collins"
          git config user.email "87616634+cyberlynz@users.noreply.github.com"
          git add -A
          git commit -m "Add Week 5 task write-ups and screenshots"
          git push origin main
